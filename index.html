<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GigaMate</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';"/>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="control-group">
    <span class="control-label">Brightness</span>
    <input type="range" min="0" max="100" value="50" class="slider" id="brightness">
    <span class="control-value" id="brightness-value">50</span>
</div>

<div class="control-group">
    <span class="control-label">Contrast</span>
    <input type="range" min="0" max="100" value="50" class="slider" id="contrast">
    <span class="control-value" id="contrast-value">50</span>
</div>

<div class="control-group">
    <span class="control-label">Volume</span>
    <input type="range" min="0" max="100" value="50" class="slider" id="volume">
    <span class="control-value" id="volume-value">50</span>
</div>

<div class="control-group kvm-group">
    <span class="control-label">KVM</span>
    <button class="kvm-btn" id="kvm-switch">Switch</button>
</div>

<div class="settings-link">
    <a href="#" id="open-settings">Settings</a>
</div>

<script>
    const {ipcRenderer} = require('electron');

    const controls = {
        brightness: document.getElementById('brightness'),
        contrast: document.getElementById('contrast'),
        volume: document.getElementById('volume')
    };

    const values = {
        brightness: document.getElementById('brightness-value'),
        contrast: document.getElementById('contrast-value'),
        volume: document.getElementById('volume-value')
    };

    const kvmSwitch = document.getElementById('kvm-switch');
    let currentKvm = 0;

    // Slider event listeners
    Object.keys(controls).forEach(name => {
        controls[name].addEventListener('input', function() {
            values[name].textContent = this.value;
            ipcRenderer.send(`${name}-change`, parseInt(this.value));
        });
    });

    // KVM switch button
    kvmSwitch.addEventListener('click', function() {
        currentKvm = currentKvm === 0 ? 1 : 0;
        ipcRenderer.send('kvm-switch-change', currentKvm);
    });

    // Receive current values from main process
    ipcRenderer.on('init-values', (event, data) => {
        Object.keys(controls).forEach(name => {
            if (data[name] !== undefined) {
                controls[name].value = data[name];
                values[name].textContent = data[name];
            }
        });

        if (data.kvm !== undefined) {
            currentKvm = data.kvm;
        }
    });

    // Request initial values when window loads
    ipcRenderer.send('request-values');

    // Settings link
    document.getElementById('open-settings').addEventListener('click', (e) => {
        e.preventDefault();
        ipcRenderer.send('open-settings');
    });
</script>

</body>
</html>
