<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GigaMate</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"/>
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="module">
    <div class="module-title">Display</div>

    <div class="slider-row">
        <div class="slider-wrap">
            <input type="range" min="0" max="100" value="50" class="slider" id="brightness" aria-label="Brightness">
            <svg class="slider-icon" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="3"/>
                <g stroke-width="1.4" stroke-linecap="round">
                    <path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/>
                </g>
            </svg>
        </div>
        <span class="slider-value" id="brightness-value">50</span>
    </div>

    <div class="slider-row">
        <div class="slider-wrap">
            <input type="range" min="0" max="100" value="50" class="slider" id="contrast" aria-label="Contrast">
            <svg class="slider-icon" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="5.6" fill="none" stroke-width="1.4"/>
                <path d="M8 2.4a5.6 5.6 0 0 1 0 11.2z"/>
            </svg>
        </div>
        <span class="slider-value" id="contrast-value">50</span>
    </div>
</section>

<section class="module">
    <div class="module-title">Sound</div>

    <div class="slider-row">
        <div class="slider-wrap">
            <input type="range" min="0" max="100" value="50" class="slider" id="volume" aria-label="Volume">
            <svg class="slider-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2 6h2.5L8 3v10L4.5 10H2z"/>
                <path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.7a6 6 0 0 1 0 8.6" fill="none" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
        </div>
        <span class="slider-value" id="volume-value">50</span>
    </div>
</section>

<section class="module module-row">
    <div>
        <div class="module-title">Input</div>
        <div class="module-subtitle">KVM switch</div>
    </div>
    <button class="push-button" id="kvm-switch">Switch</button>
</section>

<section class="module module-row" id="status">
    <div class="status-main">
        <span class="status-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16">
                <rect x="1.75" y="2.75" width="12.5" height="8" rx="1.25" fill="none" stroke-width="1.5"/>
                <path d="M6 13.5h4M8 11v2.5" fill="none" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </span>
        <div>
            <div class="module-title">Monitor</div>
            <div class="module-subtitle" id="status-text" role="status">Searching…</div>
        </div>
    </div>
    <button class="icon-button" id="open-settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="6.2" fill="none" stroke-width="2.2" stroke-dasharray="2.43 2.44"/>
            <circle cx="8" cy="8" r="4.2" fill="none" stroke-width="2.2"/>
        </svg>
    </button>
</section>

<script src="popup.js"></script>

</body>
</html>
