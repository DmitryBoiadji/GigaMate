monitor_brightness:
  url: http://127.0.0.1:3000/monitor-settings
  method: POST
  content_type: "application/x-www-form-urlencoded"
  payload: "brightness={{ brightness }}"
  verify_ssl: false

monitor_contrast:
  url: http://127.0.0.1:3000/monitor-settings
  method: POST
  content_type: "application/x-www-form-urlencoded"
  payload: "contrast={{ contrast }}"
  verify_ssl: false

monitor_volume:
  url: http://127.0.0.1:3000/monitor-settings
  method: POST
  content_type: "application/x-www-form-urlencoded"
  payload: "volume={{ volume }}"
  verify_ssl: false

monitor_kvm:
  url: http://127.0.0.1:3000/monitor-settings
  method: POST
  content_type: "application/x-www-form-urlencoded"
  payload: "kvm={{ kvm }}"
  verify_ssl: false

monitor_all:
  url: http://127.0.0.1:3000/monitor-settings
  method: POST
  content_type: "application/x-www-form-urlencoded"
  payload: "brightness={{ brightness }}&contrast={{ contrast }}&volume={{ volume }}"
  verify_ssl: false
