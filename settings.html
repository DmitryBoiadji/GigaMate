<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GigaMate Settings</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"/>
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="settings.css">
</head>
<body>

<div class="group-title">Appearance</div>
<div class="group">
    <div class="row">
        <span class="row-label">Theme</span>
        <div class="segmented" role="radiogroup" aria-label="Theme">
            <label><input type="radio" name="theme" value="system"><span>Auto</span></label>
            <label><input type="radio" name="theme" value="light"><span>Light</span></label>
            <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
        </div>
    </div>
</div>

<div class="group-title">Keyboard Shortcuts</div>
<div class="group">
    <div class="row">
        <span class="row-label">Brightness Up</span>
        <div class="recorder"><input type="text" class="shortcut-input" id="shortcut-brightnessUp" readonly placeholder="Record Shortcut" aria-label="Brightness Up shortcut"><button class="clear-btn" data-shortcut="brightnessUp" aria-label="Clear Brightness Up shortcut">✕</button></div>
    </div>
    <div class="row">
        <span class="row-label">Brightness Down</span>
        <div class="recorder"><input type="text" class="shortcut-input" id="shortcut-brightnessDown" readonly placeholder="Record Shortcut" aria-label="Brightness Down shortcut"><button class="clear-btn" data-shortcut="brightnessDown" aria-label="Clear Brightness Down shortcut">✕</button></div>
    </div>
    <div class="row">
        <span class="row-label">Contrast Up</span>
        <div class="recorder"><input type="text" class="shortcut-input" id="shortcut-contrastUp" readonly placeholder="Record Shortcut" aria-label="Contrast Up shortcut"><button class="clear-btn" data-shortcut="contrastUp" aria-label="Clear Contrast Up shortcut">✕</button></div>
    </div>
    <div class="row">
        <span class="row-label">Contrast Down</span>
        <div class="recorder"><input type="text" class="shortcut-input" id="shortcut-contrastDown" readonly placeholder="Record Shortcut" aria-label="Contrast Down shortcut"><button class="clear-btn" data-shortcut="contrastDown" aria-label="Clear Contrast Down shortcut">✕</button></div>
    </div>
    <div class="row">
        <span class="row-label">Volume Up</span>
        <div class="recorder"><input type="text" class="shortcut-input" id="shortcut-volumeUp" readonly placeholder="Record Shortcut" aria-label="Volume Up shortcut"><button class="clear-btn" data-shortcut="volumeUp" aria-label="Clear Volume Up shortcut">✕</button></div>
    </div>
    <div class="row">
        <span class="row-label">Volume Down</span>
        <div class="recorder"><input type="text" class="shortcut-input" id="shortcut-volumeDown" readonly placeholder="Record Shortcut" aria-label="Volume Down shortcut"><button class="clear-btn" data-shortcut="volumeDown" aria-label="Clear Volume Down shortcut">✕</button></div>
    </div>
    <div class="row">
        <span class="row-label">KVM Switch</span>
        <div class="recorder"><input type="text" class="shortcut-input" id="shortcut-kvmSwitch" readonly placeholder="Record Shortcut" aria-label="KVM Switch shortcut"><button class="clear-btn" data-shortcut="kvmSwitch" aria-label="Clear KVM Switch shortcut">✕</button></div>
    </div>
</div>

<div class="group-title">Startup</div>
<div class="group">
    <label class="row">
        <span class="row-label">Open at login</span>
        <input type="checkbox" class="switch" id="openAtLogin">
    </label>
</div>

<div class="group-title">Default Values</div>
<div class="group">
    <div class="row">
        <span class="row-label">Brightness</span>
        <input type="number" class="number-input" id="defaultBrightness" min="0" max="100" aria-label="Default brightness">
    </div>
    <div class="row">
        <span class="row-label">Contrast</span>
        <input type="number" class="number-input" id="defaultContrast" min="0" max="100" aria-label="Default contrast">
    </div>
    <div class="row">
        <span class="row-label">Volume</span>
        <input type="number" class="number-input" id="defaultVolume" min="0" max="100" aria-label="Default volume">
    </div>
</div>

<div class="footer">
    <span class="save-indicator" id="saveIndicator">Changes are saved automatically</span>
</div>

<script src="settings.js"></script>

</body>
</html>
